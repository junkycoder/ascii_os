name: Deploy to Cloudflare

# Auto-deploy the Worker (static ASCII shell + assets) on every push to trunk.
# Manual runs available via the Actions tab too.
on:
  push:
    branches: [trunk]
  workflow_dispatch:

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: deploy-trunk
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pin Wrangler 4.x — the action otherwise falls back to 3.90.0, which
          # can't read wrangler.jsonc (only .toml/.json) and fails with
          # "Missing entry-point". Keep roughly in step with the local CLI.
          wranglerVersion: "4.95.0"
          # account_id lives in wrangler.jsonc; no build step (zero-deps shell).
          command: deploy
