<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>FakanOS</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
    font-family: system-ui, sans-serif;
  }
  #app {
    width: 100vw; height: 100vh; display: grid; place-items: stretch;
    box-sizing: border-box;
    /* Keep the grid out of the notch / status bar / home-indicator area.
       On desktop / dev server env(safe-area-inset-*) resolves to 0, so this
       is a no-op there; on iOS (viewport-fit=cover) it insets the whole grid
       so window title bars + buttons land in the tappable region. */
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
  }
  /* Native iOS only (class set by src/mobile.js). Full-bleed: the grid extends
     all the way to the top and bottom physical edges — no top/bottom inset at
     all. Maximizes content height; the trade-off is that the top row (hint
     banner / window title bars) can sit partly under the Dynamic Island / notch
     and the bottom row under the home indicator. Left/right keep the env()
     insets from the base rule above (landscape notch). Desktop stays untouched
     (no class → plain env() above, which is 0). */
  html.cap-native #app {
    padding-top: 0;
    padding-bottom: 0;
  }

  .acii-root {
    background: var(--acii-bg, #000);
    color: var(--acii-fg, #ddd);
    font-family: var(--acii-font, monospace);
    font-size: var(--acii-size, 16px);
    line-height: 1;
    padding: 0;
    outline: none;
    /* No selection by default — drag is reserved for window manager.
       Dbl-click / triple-click / shift-click still select for copy. */
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
    width: 100%; height: 100%;
    box-sizing: border-box;
  }
  /* Allow text selection inside elements that opt in (e.g. focused
     text inputs / terminal output) — not used yet, future hook. */
  .acii-root[data-select="on"] { user-select: text; -webkit-user-select: text; }
  .acii-grid { display: block; }
  .acii-row {
    display: block;
    white-space: pre;
    height: var(--acii-size, 16px);
    line-height: var(--acii-size, 16px);
  }
  .acii-cell {
    display: inline-block;
    width: calc(var(--acii-size, 16px) * var(--acii-aspect, 0.6));
    height: var(--acii-size, 16px);
    line-height: var(--acii-size, 16px);
    text-align: center;
    vertical-align: top;
  }

  .boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #000; color: #33ff66;
    font: 14px/1.5 ui-monospace, monospace; z-index: 100;
    transition: opacity .3s ease; pointer-events: none;
  }
  .boot.hidden { opacity: 0; }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="boot" id="boot">FakanOS booting…</div>

  <script type="module">
    // ── Native-app magic link opened in a plain browser ──────────────
    // A magic link requested from the iOS app carries &target=app. If the
    // universal link fires, iOS opens the app directly and this page never
    // loads. If it doesn't (e.g. Apple's AASA CDN cache is stale), the link
    // lands here in Safari instead — so bounce the token into the app via its
    // custom URL scheme (fakanos://auth?token=…). We do NOT verify the token
    // here in that case: it's single-use, and the app must be the one to spend
    // it. Skip the bounce inside the app's own webview (Capacitor present).
    const handoffToApp = (() => {
      try {
        const p = new URLSearchParams(location.search);
        const tok = p.get('token');
        const isCap = !!(globalThis.Capacitor &&
          globalThis.Capacitor.isNativePlatform &&
          globalThis.Capacitor.isNativePlatform());
        if (tok && p.get('target') === 'app' && !isCap) {
          location.href = 'fakanos://auth?token=' + encodeURIComponent(tok);
          return true;
        }
      } catch (_) {}
      return false;
    })();

    // Cache-bust all module imports per page load. The dev server sends
    // no-store, but Chromium's ESM module map can keep stale modules
    // across navigations on the same origin — query bust guarantees fresh.
    const V = '?v=' + Date.now();
    // Lightweight first wave: engine + user store + login screen + FS factory.
    // The shell and apps are imported lazily AFTER login, so the per-user FS
    // singleton is in place before any app module evaluates its `||=` line.
    const [
      { createEngine, signal, effect, themes },
      auth,
      { createLogin },
      { createFS },
    ] = await Promise.all([
      import('./src/engine.js' + V),
      import('./src/auth.js' + V),
      import('./src/login.js' + V),
      import('./src/fs.js' + V),
    ]);

    // ── Auto-size grid to viewport ──
    // Measure the #app *content* box (viewport minus safe-area padding) so the
    // grid never extends under the notch / home indicator. getComputedStyle
    // resolves env(safe-area-inset-*) to real px on iOS, and to 0 elsewhere.
    const appEl = document.getElementById('app');
    function availableSize() {
      const cs = getComputedStyle(appEl);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      return {
        w: Math.max(0, window.innerWidth - padX),
        h: Math.max(0, window.innerHeight - padY),
      };
    }
    function computeGrid() {
      const { w, h } = availableSize();
      const fontSize = w < 500 ? 14 : 16;
      const aspect = 0.6;
      const cellW = fontSize * aspect;
      const cols = Math.max(20, Math.floor(w / cellW));
      const rows = Math.max(8, Math.floor(h / fontSize));
      return { cols, rows, fontSize };
    }

    const { cols, rows, fontSize } = computeGrid();
    const initialTheme = themes['default-dark'];
    initialTheme.font.size = fontSize;

    const engine = createEngine({
      target: '#app',
      cols, rows,
      theme: initialTheme,
      fps: 30,
    });
    engine.start();

    // mobile: native Capacitor integration (no-op in a plain browser).
    // Loaded here — not only in the www/ build patch — because the iOS app
    // loads this very page live from os.fakan.cz (capacitor.config server.url).
    // Without it the native splash never hides (initMobile calls SplashScreen.hide).
    import('./src/mobile.js' + V)
      .then((m) => m.initMobile && m.initMobile(engine))
      .catch(() => {});

    // ── Responsive resize ──
    let resizeT = null;
    function reflow() {
      const g = computeGrid();
      engine.theme.value = { ...engine.theme.peek(), font: { ...engine.theme.peek().font, size: g.fontSize } };
      engine.resize(g.cols, g.rows);
    }
    window.addEventListener('resize', () => {
      if (resizeT) clearTimeout(resizeT);
      resizeT = setTimeout(reflow, 100);
    });
    // iOS: safe-area insets aren't reliably resolved on the very first frame,
    // and 'resize' may not fire on initial layout — recompute once they settle.
    window.addEventListener('orientationchange', () => setTimeout(reflow, 150));
    setTimeout(reflow, 300);

    // ── Hide boot screen once loop ticks ──
    setTimeout(() => {
      document.getElementById('boot').classList.add('hidden');
    }, 200);

    window.engine = engine;
    window.themes = themes;
    window.auth = auth;

    // ── Boot the desktop shell for a logged-in user ─────────────────
    async function bootShell(user) {
      // Seed the per-user FS singleton BEFORE importing shell/apps so their
      // `globalThis.__aciiFS ||= createFS(...)` lines adopt this instance.
      globalThis.__aciiFS = createFS({ storageKey: auth.fsKey(user) });

      const [
        { createShell },
        { createApp: createTerminal },
        { createApp: createSnake },
        { createApp: createNotes },
        { createApp: createPaint },
        { createApp: createReadme },
        { createApp: createFindman },
        { createApp: createMediaMogul },
        { createApp: createGameMaker },
        { createApp: createTimetrack },
        { createApp: createGitDesk },
        { createApp: createShare },
      ] = await Promise.all([
        import('./src/shell.js' + V),
        import('./src/apps/terminal.js' + V),
        import('./src/apps/snake.js' + V),
        import('./src/apps/notes.js' + V),
        import('./src/apps/paint.js' + V),
        import('./src/apps/readme.js' + V),
        import('./src/apps/findman.js' + V),
        import('./src/apps/mediamogul.js' + V),
        import('./src/apps/gamemaker.js' + V),
        import('./src/apps/timetrack.js' + V),
        import('./src/apps/gitdesk.js' + V),
        import('./src/apps/share.js' + V),
      ]);

      const appRegistry = [
        { id: 'readme',    label: 'README',    icon: '[?]', factory: createReadme },
        { id: 'findman',   label: 'Findman',   icon: '[▸]', factory: createFindman },
        { id: 'gitdesk',   label: 'Git Desk',  icon: '[⎇]', factory: createGitDesk },
        { id: 'terminal',  label: 'Terminal',  icon: '[$]', factory: createTerminal },
        { id: 'notes',     label: 'Notes',     icon: '[≡]', factory: createNotes },
        { id: 'paint',     label: 'Paint',     icon: '[✎]', factory: createPaint },
        { id: 'mediamogul',label: 'Media House',icon: '[▶]', factory: createMediaMogul },
        { id: 'gamemaker', label: 'GameMaker', icon: '[♛]', factory: createGameMaker },
        { id: 'timetrack', label: 'Time',      icon: '[◷]', factory: createTimetrack },
        { id: 'share',     label: 'Share',     icon: '[⇄]', factory: createShare },
        { id: 'snake',     label: 'Snake',     icon: '[●]', factory: createSnake },
      ];

      const shell = createShell(engine, {
        apps: appRegistry,
        background: 'dots',
        taskbarPosition: 'bottom',
        storageKey: auth.shellKey(user),
        user,
        onLogout: () => { auth.clearSession(); location.reload(); },
      });

      const offFrame = engine.onFrame(() => shell.render());

      // A shared link (/?share=<code>) opens straight into the Share app to join.
      let shareCode = null;
      try { shareCode = new URLSearchParams(location.search).get('share'); } catch (_) {}
      if (shareCode) {
        globalThis.__aciiShareJoin = shareCode;
        setTimeout(() => shell.openApp('share'), 50);
      } else if (shell.running.size === 0) {
        // First-run for this user: open README so there's something to read.
        setTimeout(() => shell.openApp('readme'), 50);
      }

      window.shell = shell;
    }

    // ── Login → shell handoff ───────────────────────────────────────
    // One login instance owns the email/magic-link flow. A magic-link token can
    // arrive three ways: typed-in flow already on this screen, a web link
    // landing on /auth?token=… (this tab), or an iOS universal link / deeplink
    // (mobile.js → __aciiHandleAuthToken). All funnel through login.signIn().
    function startLogin() {
      const login = createLogin(engine, {
        onLogin: async (user) => {
          login.destroy();      // stop login render + input
          auth.cleanUrl();
          await bootShell(user);
        },
      });
      window.login = login;
      globalThis.__aciiHandleAuthToken = (tok) => login.signIn(tok);
      // A deeplink may have fired before the handler existed (iOS cold start).
      if (globalThis.__aciiPendingAuthToken) {
        const t = globalThis.__aciiPendingAuthToken;
        globalThis.__aciiPendingAuthToken = null;
        login.signIn(t);
      }
      return login;
    }

    // Boot priority: a magic-link token in the URL wins; otherwise a remembered
    // session boots the shell straight away (revalidated in the background);
    // otherwise show the login form.
    const urlToken = auth.tokenFromUrl();
    const session = auth.getSession();
    if (handoffToApp) {
      // Already redirected to the native app (fakanos://); leave the token
      // unconsumed for the app to verify. Nothing more to do in this tab.
    } else if (urlToken) {
      const login = startLogin();
      await login.signIn(urlToken);   // verify → onLogin → bootShell (or surfaces an error)
    } else if (session) {
      await bootShell(session.user);
      // Long-remember: only sign out if the server explicitly rejects the token.
      auth.refresh().then((s) => { if (!s) location.reload(); }).catch(() => {});
    } else {
      startLogin();
    }
  </script>
</body>
</html>
